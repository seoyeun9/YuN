<header class="header">
 
  <style>
    .header {
       position: fixed;
       
       width: 100vw;
       display: flex;
       justify-content: space-between;
       align-items: center;
       padding: 60px 60px;
       box-sizing: border-box;
       z-index: 10;
     }

    .logo-top a {
        display: inline-block;
        width: 100%;
        height: 100%;
        }

    .logo-top img {
        display: block;
        height: 35px;
        width: auto;
        }

    .nav-menu {
        display: flex;
        gap: 60px;
        flex-shrink: 0;
        }

    .nav-item {
        text-decoration: none;
        color: #1A2223;
        
        font-family: "abhaya-libre", sans-serif;
        font-weight: 700;
        font-style: normal;    
        font-size: 20px;
        
        transition: opacity 0.3s ease;
        }

    .nav-item:hover {
        opacity: 0.5;
        }

    .header {
        opacity: 0;
    
        animation: headerFadeInDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        animation-delay: 1s;
    }
    
    @keyframes headerFadeInDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }  
   </style>

  
    <div class="logo-top">
      <a href="home.html">
        <img src="image/logo.svg" alt="YUN Logo">
      </a>

    </div>
      <nav class="nav-menu">
        <a href="#contact-section" class="nav-item">Contact</a>
        <a href="work.html" class="nav-item">Work</a>
      </nav>
  
</header>
